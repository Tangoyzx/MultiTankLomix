server {
    listen __PORT__;
    server_name _;

    root __DOCROOT__;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain;

    # 单页应用：未知路径回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 产物文件名不带哈希，入口必须不缓存，否则更新后玩家拿到旧页面
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    access_log /var/log/nginx/multitank.access.log;
    error_log  /var/log/nginx/multitank.error.log;
}
