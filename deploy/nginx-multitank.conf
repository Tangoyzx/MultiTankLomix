server {
    listen __PORT__;
    server_name _;

    root __DOCROOT__;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain;

    # 入口与版本清单永不缓存：玩家每次打开都拿最新页面，js/css 的 ?v= 也跟着换
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location = /version.json {
        add_header Cache-Control "no-store" always;
    }

    # 资源带 ?v=<构建指纹>，指纹一变 URL 就变；这里仍要求每次回源校验，双保险
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # 远端对战：WebSocket 转给本机的对局服务（node server/start-match.mjs）
    location = /ws {
        proxy_pass http://127.0.0.1:__WSPORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /var/log/nginx/multitank.access.log;
    error_log  /var/log/nginx/multitank.error.log;
}
